name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hono_react_starter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hono_react_starter_test
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.19'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test (server)
        run: bun run test:server

      - name: Test (UI)
        run: bun run test:ui

      - name: Build
        run: bun run build

      - name: Smoke test production server
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          BETTER_AUTH_URL: https://ci.example.com
          PORT: 3100
        run: |
          bun run start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3100/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3100/api/health
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3100/ | grep -q 200
          kill %1 || true
          cat server.log

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hono-react-starter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
