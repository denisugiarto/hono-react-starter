name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN hanya baca; job yang butuh lebih mendeklarasikan sendiri.
permissions:
  contents: read

env:
  NX_DAEMON: 'false'

jobs:
  check:
    name: Typecheck · Lint · Test · Build (Nx)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hono_react_starter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hono_react_starter_test
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # riwayat penuh untuk `nx affected`

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.19'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gagal bila ada advisory high/critical yang mengenai versi terpasang (scripts/audit.ts)
      - name: Audit dependensi
        run: bun scripts/audit.ts

      # Tentukan base/head untuk nx affected (PR: base branch; push: commit sebelumnya)
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - name: Typecheck · Lint · Test · Build · Storybook (semua proyek)
        run: bunx nx run-many -t typecheck lint test build build-storybook --output-style=static

      - name: Ringkasan proyek terdampak (informasi)
        run: bunx nx show projects --affected || true

      - name: Smoke test production server (apps/api menyajikan apps/web/dist)
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          # Postgres service CI tanpa TLS; pemeriksaan sslmode production dilonggarkan khusus smoke test
          DATABASE_SSL_REQUIRED: 'false'
          BETTER_AUTH_URL: https://ci.example.com
          PORT: 3100
        working-directory: apps/api
        run: |
          bun run start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3100/api/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3100/api/health/live
          curl -fsS http://localhost:3100/api/health/ready
          curl -fsS http://localhost:3100/api/health
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3100/ | grep -q 200
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3100/dashboard | grep -q 200
          kill %1 || true
          cat server.log

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hono_react_starter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hono_react_starter_test
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.19'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium (Playwright)
        run: bunx playwright install --with-deps chromium
      # Target e2e bergantung pada web:build (Nx) → server apps/api menyajikan dist +
      # migrasi + seed demo (akun di packages/shared/src/demo.ts), lalu Playwright berjalan.
      - name: Playwright
        run: bunx nx run e2e:e2e --output-style=static
      - name: Laporan Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: hono-react-starter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
