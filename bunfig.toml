[test]
# Preload ditentukan per-skrip (lihat package.json: test:server / test:ui)
# karena test server dan test UI (happy-dom) butuh lingkungan berbeda.
coverage = true
coverageSkipTestFiles = true
# Gagal bila cakupan di bawah 90% (baris & fungsi). Catatan: Bun menerapkan
# ambang ini PER FILE untuk setiap file yang dimuat, bukan hanya total.
coverageThreshold = { lines = 0.9, functions = 0.9 }
# Dikecualikan: kode pendukung test, deklarasi schema Drizzle (tanpa logika,
# auth-schema di-generate CLI Better Auth) dan primitif shadcn/ui (vendored).
coveragePathIgnorePatterns = [
  "tests/**",
  "src/server/db/schema.ts",
  "src/server/db/auth-schema.ts",
  "src/components/ui/**",
]
